name: Process notification emails

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: notification-email-worker
  cancel-in-progress: false

jobs:
  process:
    if: github.repository == 'OmarMohammedSiddique/alumniconnect'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process due activity emails
        env:
          NOTIFICATION_WORKER_SECRET: ${{ secrets.NOTIFICATION_WORKER_SECRET }}
        run: |
          test -n "$NOTIFICATION_WORKER_SECRET"
          curl --fail --silent --show-error --max-time 55 \
            --request POST \
            --header "Authorization: Bearer ${NOTIFICATION_WORKER_SECRET}" \
            https://alumnikonneqt.com/api/notifications/process
